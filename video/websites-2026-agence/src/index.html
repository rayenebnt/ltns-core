<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomone — Studio de croissance (concept fictif)</title>
<meta name="description" content="Concept fictif&#8239;: le site d’un studio imaginaire de sites et de référencement, de la graine à la récolte, au défilement. Imaginé par LTNS°.">
<meta name="robots" content="noindex">
<!--@STYLE@-->
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <!-- the mark: a pear with its leaf -->
    <symbol id="i-mark" viewBox="0 0 32 32"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M16 9.6c-2.2 0-3.4 1.7-3.6 3.9-.2 2.3-2.9 3.6-3.6 6.6-1 4.1 2.3 8.3 7.2 8.3s8.2-4.2 7.2-8.3c-.7-3-3.4-4.3-3.6-6.6-.2-2.2-1.4-3.9-3.6-3.9z" stroke-width="1.5"/><path d="M16 9.6c.1-2.1.7-3.9 2.1-5.2" stroke-width="1.3"/><path d="M18.1 5.8c1.9-1.7 4.6-1.8 6.4-.6-1.5 1.8-4.3 2.3-6.4.6z" stroke-width="1.2"/></g></symbol>
    <!-- « Sous un toit »: a page, a quill, a seed -->
    <symbol id="i-site" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><rect x="3.4" y="4.6" width="17.2" height="14.8" rx="1.6"/><path d="M3.4 8.4h17.2M6 6.5h.1M8 6.5h.1M7 12h10M7 15h6"/></g></symbol>
    <symbol id="i-plume" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M19.6 4.4c-6.2.4-11.4 5-12.6 12.4"/><path d="M19.6 4.4c-.8 6.6-5.4 10.4-11.2 10.8"/><path d="M7 16.8l-2.6 2.8"/></g></symbol>
    <symbol id="i-graine" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20.4v-8"/><path d="M12 12.4c0-3.6 2.4-6 6-6 0 3.6-2.4 6-6 6z"/><path d="M12 14.8c0-2.9-2-4.8-4.8-4.8 0 2.9 2 4.8 4.8 4.8z"/><path d="M7.6 20.4h8.8"/></g></symbol>
    <symbol id="i-down" viewBox="0 0 12 20"><path d="M6 1.5v16M1.8 13.4 6 17.6l4.2-4.2" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<canvas id="scene" aria-hidden="true"></canvas>

<!-- the real scroll height: SCREENS screens of story, then the « Rendez-vous » section (main.js) -->
<div id="scroll-space" aria-hidden="true"></div>

<!-- the text beats over the pinned 3D story (positions and opacities: ui.js) -->
<main id="hud">
  <!-- under the header over the 3D: a soft backdrop (studio grey in the dark tone, deep blue in the
       light tone; opacity from p: ui.js) -->
  <i class="headscrim" id="headscrim" aria-hidden="true"></i>

  <section class="beat beat-hero" id="b-hero">
    <p class="kicker" data-t="hero.kicker"></p>
    <h1 class="display" id="t-hero"></h1>
    <p class="lead" data-t="hero.text"></p>
  </section>
  <p class="hint" id="hint"><span data-t="hero.hint"></span><svg class="hint-arrow" aria-hidden="true"><use href="#i-down"/></svg></p>

  <section class="beat beat-side" id="b-build">
    <p class="kicker" data-t="build.kicker"></p>
    <h2 class="display" id="t-build"></h2>
    <p class="lead" data-t="build.text"></p>
  </section>

  <section class="beat beat-side beat-rank" id="b-rank">
    <h2 class="display" id="t-rank"></h2>
    <p class="lead" data-t="rank.text"></p>
  </section>

  <section class="beat beat-side beat-roof" id="b-roof">
    <p class="kicker" data-t="roof.kicker"></p>
    <h2 class="display" id="t-roof"></h2>
    <p class="lead" data-t="roof.text"></p>
    <ul class="points" id="points"></ul>
  </section>

  <section class="beat beat-model" id="b-model">
    <p class="kicker" data-t="model.kicker"></p>
    <h2 class="display" id="t-model"></h2>
    <p class="lead" data-t="model.text"></p>
  </section>

  <section class="beat beat-side" id="b-non">
    <h2 class="display" id="t-non"></h2>
    <p class="lead" data-t="non.text"></p>
  </section>

  <section class="beat beat-faq" id="b-faq">
    <p class="kicker" data-t="faq.kicker"></p>
    <h2 class="display" id="t-faq"></h2>
    <div class="faq" id="faq"></div>
  </section>
</main>

<!-- « Rendez-vous »: slides up over the canvas from STORY_END -->
<section id="final" class="final" aria-labelledby="t-final">
  <div class="f-inner">
    <div class="f-main">
      <p class="kicker k-final" data-t="rendezvous.kicker"></p>
      <h2 class="display" id="t-final"></h2>
      <p class="f-text" data-t="rendezvous.text"></p>
      <div class="f-actions">
        <button class="btn btn-dark cta" type="button" id="f-quote"><span data-t="rendezvous.primary"></span></button>
        <button class="btn btn-line" type="button" id="f-replay"><span data-t="rendezvous.secondary"></span></button>
      </div>
    </div>
    <div class="f-side">
      <div class="ticket" id="ticket">
        <div class="t-head"><p class="t-title" id="t-ticket-head"></p><p class="t-num" id="t-ticket-num"></p></div>
        <ol class="t-steps" id="t-steps"></ol>
        <p class="stamp" id="stamp"><span id="stamp-text"></span></p>
      </div>
    </div>
  </div>
  <div class="f-foot">
    <p class="f-credit" data-t="credit"></p>
    <svg class="f-mark" aria-hidden="true"><use href="#i-mark"/></svg>
    <p class="f-statement" data-t="rendezvous.statement"></p>
  </div>
</section>

<header id="top" class="top">
  <a class="brand" id="brand" href="#" aria-label="Pomone">
    <span class="brand-row"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg><span class="brand-name" data-t="brand.name"></span></span>
    <span class="brand-tag" data-t="brand.tagline"></span>
  </a>
  <nav class="nav" id="nav" aria-label="Chapitres"></nav>
  <button class="pill cta" type="button" id="top-quote"><span data-t="cta"></span></button>
</header>

<nav id="rail" class="rail" aria-label="Progression"></nav>

<p id="credit" class="credit" data-t="credit"></p>
<div id="toast" role="status" aria-live="polite"></div>

<div id="loader">
  <p class="loader-logo"><svg class="mark mark-swing" aria-hidden="true"><use href="#i-mark"/></svg><span class="brand-name" data-t="brand.name"></span></p>
  <i class="loader-bar"><b id="loader-fill"></b></i>
</div>

<div id="nogl" hidden>
  <div>
    <p class="loader-logo"><svg class="mark" aria-hidden="true"><use href="#i-mark"/></svg><span class="brand-name" data-t="brand.name"></span></p>
    <p class="nogl-title" data-t="nogl.0"></p>
    <p data-t="nogl.1"></p>
    <p class="nogl-credit" data-t="credit"></p>
  </div>
</div>

<!--@SCRIPT@-->
</body>
</html>
