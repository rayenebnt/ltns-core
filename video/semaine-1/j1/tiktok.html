<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LTNS° — Semaine 1 · Jour 1 « Plombier : une page, pas six »</title>
<!--
  Semaine 1, jour 1 (nouveau format, voir ../../PLAN-30-JOURS.md et ../../SEMAINE-1.md).
  Image 0 : le site fini « Plomberie Varenne » (entreprise fictive) en grand, titre fixe complet.
  Le site défile d'un geste ; quatre « pages » sortent du téléphone et rentrent dans la page unique ;
  « À propos » est écartée ; tap sur la zone, le numéro s'allume ; carte de fin ; retour à l'image 0.
  Les gestes (défilement, retour en haut, tap) seront remplacés au montage par les mains filmées
  sur l'ordinateur (version pc.html). Vidéo 1080 × 1920, 30 i/s.
-->
<link rel="stylesheet" href="../../commun/fonts.css">
<style>
  :root { --paper: #F5F3EE; --ink: #16161A; --mute: #6B6B75; --line: rgba(22, 22, 26, .08); --blue: #1D4ED8; --accent: #0891B2; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #111; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 1080px; height: 1920px; overflow: hidden;
    background: radial-gradient(circle at 50% 46%, rgba(29, 78, 216, .10), transparent 55%),
      linear-gradient(var(--line) 2px, transparent 2px) 0 0 / 60px 60px, linear-gradient(90deg, var(--line) 2px, transparent 2px) 0 0 / 60px 60px, var(--paper);
    font-family: 'Space Grotesk', sans-serif; color: var(--ink); }
  #title, #caption, #hud, #phone, .gc, #touch, #endcard, #drop, #sticker { will-change: transform, opacity; }

  /* Titre fixe (0–3 s) et sous-titres par phrase entière, dans la même bande */
  #title { position: absolute; left: 40px; right: 40px; top: 250px; height: 230px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-weight: 700; font-size: 92px; line-height: 1; letter-spacing: -3px; text-transform: uppercase; z-index: 20; }
  #title em { font-style: italic; font-weight: 500; color: var(--blue); }
  #caption { position: absolute; left: 60px; right: 60px; top: 250px; height: 220px; display: flex; flex-wrap: wrap; align-items: center; justify-content: center; align-content: center; gap: 0 18px; text-align: center; font-weight: 700; font-size: 66px; line-height: 1.04; letter-spacing: -1.5px; text-transform: uppercase; z-index: 20; }
  #caption .w { color: rgba(22, 22, 26, .3); }
  #caption .w.on { color: var(--ink); }
  #caption .w.hl.on { color: var(--blue); font-style: italic; font-weight: 500; }
  #hud { position: absolute; left: 70px; right: 70px; top: 165px; display: flex; align-items: center; gap: 16px; font-family: 'JetBrains Mono', monospace; font-size: 26px; letter-spacing: 3px; color: var(--mute); opacity: 0; z-index: 20; }
  #hud b { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 36px; letter-spacing: -1px; color: var(--ink); }
  #hud b span { color: var(--accent); }

  /* Le téléphone */
  #phone { position: absolute; left: 230px; top: 505px; width: 620px; height: 1150px; border-radius: 70px; padding: 14px; background: linear-gradient(145deg, #2a2a33, #0f0f12); box-shadow: 0 70px 120px -50px rgba(22, 22, 26, .7), inset 0 0 0 3px rgba(255, 255, 255, .08); z-index: 5; }
  #scr { position: relative; width: 100%; height: 100%; border-radius: 56px; overflow: hidden; background: #fff; }
  #sbar { position: absolute; left: 0; right: 0; top: 0; height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 34px; font-family: 'Montserrat', sans-serif; font-weight: 700; font-size: 17px; background: #fff; z-index: 3; }
  #sbar i { position: absolute; left: 50%; top: 10px; width: 110px; height: 28px; margin-left: -55px; border-radius: 16px; background: #0f0f12; }
  #view { position: absolute; left: 0; right: 0; top: 40px; bottom: 0; overflow: hidden; }
  #site { width: 400px; transform-origin: 0 0; }
  #bar { position: absolute; right: 6px; top: 50px; width: 6px; bottom: 16px; border-radius: 3px; background: rgba(15, 23, 42, .08); z-index: 3; }
  #bar i { position: absolute; left: 0; right: 0; border-radius: 3px; background: var(--blue); }

  /* « Pages » qui sortent du téléphone et rentrent dans la page unique */
  .gc { position: absolute; left: 0; top: 0; width: 360px; padding: 20px 22px; border-radius: 22px; background: #fff; border: 3px solid var(--ink); box-shadow: 0 30px 50px -24px rgba(22, 22, 26, .55); display: flex; align-items: center; gap: 14px; font-family: 'Montserrat', sans-serif; z-index: 8; opacity: 0; }
  .gc .pg { width: 46px; height: 58px; border-radius: 8px; border: 3px solid var(--ink); position: relative; flex: none; background: #fff; }
  .gc .pg::before { content: ''; position: absolute; left: 7px; right: 7px; top: 9px; height: 5px; background: var(--blue); border-radius: 3px; box-shadow: 0 11px 0 #CBD5E1, 0 21px 0 #CBD5E1, 0 31px 0 #CBD5E1; }
  .gc small { display: block; font-family: 'JetBrains Mono', monospace; font-size: 15px; letter-spacing: 2px; color: var(--mute); }
  .gc b { display: block; font-weight: 800; font-size: 38px; letter-spacing: -.5px; }
  .gc.off { border-color: #9CA3AF; color: #9CA3AF; }
  .gc.off .pg { border-color: #9CA3AF; }
  #drop { position: absolute; left: 90px; top: 640px; width: 180px; height: 180px; color: var(--blue); z-index: 9; opacity: 0; }

  /* Doigt (repère de geste, remplacé au montage par la vraie main) */
  #touch { position: absolute; left: 0; top: 0; width: 86px; height: 86px; margin: -43px 0 0 -43px; border-radius: 50%; background: rgba(255, 255, 255, .55); border: 5px solid rgba(29, 78, 216, .85); box-shadow: 0 10px 24px -8px rgba(15, 23, 42, .5); z-index: 12; opacity: 0; }

  /* Fin */
  #endcard { position: absolute; left: 70px; right: 70px; top: 640px; z-index: 15; background: var(--ink); color: #fff; padding: 40px 44px 44px; border-radius: 30px; box-shadow: 0 50px 90px -40px rgba(22, 22, 26, .7); opacity: 0; }
  #endcard h4 { font-weight: 700; font-size: 62px; letter-spacing: -2px; line-height: 1.02; }
  #endcard p { margin-top: 18px; font-size: 34px; color: #CBD5E1; }
  #endcard p b { color: #fff; }
  #endcard .tag { display: inline-block; margin-top: 22px; font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: 2px; color: var(--ink); background: #67E8F9; padding: 8px 14px; border-radius: 10px; }
  #endcard .brand { position: absolute; right: 40px; top: 36px; font-weight: 700; font-size: 40px; letter-spacing: -1px; }
  #endcard .brand span { color: #22D3EE; }
  #sticker { position: absolute; left: 640px; top: 1010px; width: 300px; z-index: 16; opacity: 0; }
</style>
</head>
<body>
<div id="stage">
  <div id="hud"><b>LTNS<span>°</span></b><span>// SITE PLOMBIER</span></div>
  <div id="title"><div>Plombier : une page.</div><div><em>Pas six.</em></div></div>
  <div id="caption"></div>

  <div id="phone"><div id="scr">
    <div id="sbar"><span>9:41</span><i></i><span>5G ▮</span></div>
    <div id="view"><div id="site"></div></div>
    <div id="bar"><i></i></div>
  </div></div>

  <div class="gc" data-k="serv"><span class="pg"></span><div><small>PAGE 2</small><b>Services</b></div></div>
  <div class="gc" data-k="zone"><span class="pg"></span><div><small>PAGE 3</small><b>Zone</b></div></div>
  <div class="gc" data-k="chant"><span class="pg"></span><div><small>PAGE 4</small><b>Chantiers</b></div></div>
  <div class="gc" data-k="contact"><span class="pg"></span><div><small>PAGE 5</small><b>Contact</b></div></div>
  <div class="gc" data-k="apropos"><span class="pg"></span><div><small>PAGE 6</small><b>À propos</b></div></div>
  <svg id="drop" viewBox="0 0 24 24" fill="#DBEAFE" stroke="currentColor" stroke-width="1.6"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
  <div id="touch"></div>

  <div id="endcard"><span class="brand">LTNS<span>°</span></span><h4>Ton entreprise<br>en Île-de-France ?</h4><p><b>Devis gratuit sous 48 h</b> · lien en bio</p><span class="tag">FORMULE ESSENTIEL · UNE PAGE</span></div>
  <img id="sticker" alt="">
</div>

<script src="../../commun/avatar.js"></script>
<script src="../../commun/engine.js"></script>
<script src="site.js"></script>
<script src="voice-files.js"></script>
<script>
const { clamp, easeInOut, easeOut, easeIn, pop, ramp, pulse, lerp, $, qa, setT, caption } = LTNS

const SENTENCES = [
  { chunks: [['Plombier :', 'Plombier'], ['une page, pas six.', 'six.']] },
  { chunks: [['Un coup de pouce,', 'pouce,'], ['et ton client a tout vu.', 'tout']] },
  { chunks: [['Tes services, ta zone,', 'zone,'], ['tes chantiers, ton numéro.', 'numéro.']] },
  { chunks: [['Ton client a une fuite,', 'fuite,'], ['il cherche pas ta page À propos.', 'propos.']] },
  { chunks: [['Il veut savoir si tu viens chez lui,', 'viens'], ["c'est TOUT.", 'TOUT.']] },
  { chunks: [['Et ton métier,', 'métier,'], ['il tient sur une page ?', 'page']] },
]
// [phrase, mot ou fraction, décalage (s), son]
const CUES = {
  p1: [0, 0.3, 0, 'tick'], p2: [0, 0.62, 0, 'tick'],
  scroll: [1, 'coup', -0.25, 'whoosh'],
  serv: [2, 'services,', -0.1, 'pop'], zone: [2, 'zone,', -0.1, 'pop'], chant: [2, 'chantiers,', -0.1, 'pop'], num: [2, 'numéro.', -0.1, 'pop'],
  fuite: [3, 'fuite,', -0.1, 'tick'], apropos: [3, 'page', -0.1, 'pop'], apOut: [3, 'propos.', 0.15, 'whoosh'],
  up: [4, 0, -0.15, 'whoosh'], tap: [4, 'viens', -0.1, 'tick'], tout: [4, 'TOUT.', -0.05, 'pop'],
  endc: [5, 0, -0.1, 'whoosh'],
}
const GHOSTS = ['serv', 'zone', 'chant', 'num']
const GHOST_SECTION = { serv: 'serv', zone: 'zone', chant: 'chant', num: 'contact' }
const SCALE = 592 / 400, VIEW_H = (1122 - 40) / SCALE

let site
const ghostEl = k => document.querySelector(`.gc[data-k="${k === 'num' ? 'contact' : k}"]`)

// Défilement : suite d'étapes [début, durée, cible 0 → 1]
function scrollAt(t, C, tail) {
  if (tail) return 0
  const steps = [[C.scroll, 1.8, 1]]
  GHOSTS.forEach(k => steps.push([C[k] + 0.5, 0.4, site.scrollFor(GHOST_SECTION[k], VIEW_H)]))
  steps.push([C.up, 0.4, 0])
  let v = 0
  for (const [t0, d, to] of steps) if (t >= t0) v = lerp(v, to, easeInOut(ramp(t, t0, d)))
  return v
}

function render(t, k) {
  const { C, TIMES } = k
  const tail = t >= C.loop
  // Titre fixe 0–3 s, puis sous-titres ; le titre revient pour la boucle
  const titleOn = tail ? clamp(pop(t, C.loop + 0.15, 0.3)) : 1 - ramp(t, 2.8, 0.3)
  setT($('title'), titleOn, `scale(${0.96 + 0.04 * titleOn})`)
  caption($('caption'), t, k, { from: 3.0, hide: tail })
  $('hud').style.opacity = tail ? 0 : ramp(t, 3.0, 0.3)

  // Téléphone : décalé à droite pendant les « pages », de retour au centre ensuite
  const shift = tail ? 0 : easeInOut(ramp(t, TIMES[2].start - 0.35, 0.4)) - easeInOut(ramp(t, C.up - 0.1, 0.4))
  const endK = tail ? 1 - easeInOut(ramp(t, C.loop, 0.35)) : easeInOut(ramp(t, C.endc, 0.45))
  $('phone').style.transform = `translate(${shift * 170}px, ${endK * 120 + Math.sin(t * 1.4) * 4}px) scale(${1 - 0.12 * endK}) rotate(${Math.sin(t * 0.9) * 0.6}deg)`
  $('phone').style.opacity = 1 - 0.55 * endK

  // Site : défilement, éclat des sections, zone, numéro
  const sc = scrollAt(t, C, tail)
  const glow = {}
  GHOSTS.forEach(g => { glow[GHOST_SECTION[g]] = (glow[GHOST_SECTION[g]] || 0) + pulse(t, C[g] + 0.75, 0.6) })
  glow.serv = Math.max(glow.serv || 0, pulse(t, C.p2, 0.5))
  glow.zone = Math.max(glow.zone || 0, pulse(t, C.tap, 0.7))
  site.update({ scroll: sc, glow, zone: tail ? 0 : pulse(t, C.p1, 0.5) * 0.5 + easeOut(ramp(t, C.tap, 0.4)) * (1 - ramp(t, C.endc, 0.4)) * (1 + 0.15 * Math.sin(t * 8)), call: tail ? 0 : pulse(t, C.tout, 0.9), viewH: VIEW_H })
  const trackH = 1122 - 66, thumb = trackH * VIEW_H / site.el.scrollHeight
  $('bar').firstElementChild.style.height = thumb + 'px'
  $('bar').firstElementChild.style.top = ((trackH - thumb) * sc) + 'px'
  $('bar').style.opacity = 0.3 + 0.7 * (pulse(t, C.scroll, 2.0) + pulse(t, C.up, 0.8))

  // Les quatre « pages » : sortent du téléphone, se posent à gauche, rentrent dans la page unique
  const ph = $('phone').getBoundingClientRect(), st = $('stage').getBoundingClientRect(), z = st.width / 1080
  const phx = (ph.left - st.left) / z + 140, phy = (ph.top - st.top) / z + 300
  GHOSTS.forEach((g, i) => {
    const el = ghostEl(g)
    const out = easeOut(ramp(t, C[g], 0.3)), back = easeIn(ramp(t, C[g] + 0.5, 0.35))
    const on = !tail && t >= C[g] && back < 1
    const sx = 30, sy = 600 + i * 150
    const x = lerp(lerp(phx, sx, out), phx + 40, back), y = lerp(lerp(phy, sy, out), phy + 120, back)
    setT(el, on ? 1 : 0, `translate(${x}px, ${y}px) rotateY(${(1 - out) * 50}deg) scale(${(0.5 + 0.5 * out) * (1 - 0.6 * back)})`)
  })
  // « À propos » sort, hésite, devient grise et part hors cadre
  const ap = ghostEl('apropos')
  const aIn = easeOut(ramp(t, C.apropos, 0.3)), aOff = easeIn(ramp(t, C.apOut, 0.5))
  ap.classList.toggle('off', t >= C.apOut - 0.25)
  const wob = t > C.apOut - 0.45 && t < C.apOut ? Math.sin(t * 40) * 4 : 0
  setT(ap, !tail && t >= C.apropos && aOff < 1 ? 1 : 0, `translate(${lerp(lerp(phx, 30, aIn), -460, aOff)}px, ${lerp(phy, 860, aIn)}px) rotate(${wob - aOff * 20}deg) scale(${0.5 + 0.5 * aIn})`)
  // Une fuite : une goutte tombe
  const dp = pulse(t, C.fuite, 0.9)
  setT($('drop'), !tail && dp > 0 ? dp : 0, `translateY(${ramp(t, C.fuite, 0.9) * 160}px) scale(${0.6 + 0.4 * dp})`)

  // Repère de doigt : défilement, retour en haut, tap
  let tx = 0, ty = 0, to = 0
  const cx = (ph.left - st.left) / z + ph.width / z * 0.62
  if (!tail && t > C.scroll - 0.2 && t < C.scroll + 1.9) { const p = easeInOut(ramp(t, C.scroll, 1.8)); tx = cx; ty = lerp(1300, 760, p); to = 1 - ramp(t, C.scroll + 1.7, 0.2) }
  if (!tail && t > C.up - 0.15 && t < C.up + 0.55) { const p = easeInOut(ramp(t, C.up, 0.4)); tx = cx; ty = lerp(760, 1220, p); to = 1 - ramp(t, C.up + 0.4, 0.15) }
  if (!tail && t > C.tap - 0.35 && t < C.tap + 0.5) {
    const zr = site.sections.zone.getBoundingClientRect()
    tx = (zr.left - st.left) / z + zr.width / z * 0.5; ty = (zr.top - st.top) / z + zr.height / z * 0.62
    to = ramp(t, C.tap - 0.35, 0.15) * (1 - ramp(t, C.tap + 0.3, 0.2))
  }
  const press = Math.abs(t - C.tap) < 0.08 ? 0.8 : 1
  setT($('touch'), to, `translate(${tx}px, ${ty}px) scale(${press})`)

  // Carte de fin, et l'avatar en signature
  const ec = tail ? 1 - ramp(t, C.loop, 0.3) : pop(t, C.endc + 0.15, 0.45)
  setT($('endcard'), ec > 0 ? clamp(ec) : 0, `translateY(${(1 - clamp(ec)) * 60}px) scale(${0.9 + 0.1 * ec})`)
  const sk = tail ? 1 - ramp(t, C.loop, 0.25) : pop(t, C.endc + 0.55, 0.4)
  setT($('sticker'), sk > 0 ? clamp(sk) : 0, `translateY(${(1 - clamp(sk)) * 80}px) rotate(${-4 + Math.sin(t * 2) * 2}deg) scale(${0.8 + 0.2 * sk})`)
}

LTNS.start({
  sentences: SENTENCES, cues: CUES, tail: 0.7, render,
  extraEvents: C => [{ t: C.loop + 0.1, sfx: 'whoosh' }, ...GHOSTS.map(g => ({ t: C[g] + 0.8, sfx: 'tick' }))],
  ready: async () => {
    site = Site.build($('site'))
    $('site').style.transform = `scale(${SCALE})`
    const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(LTNSAvatar.svg({ pose: 'pointUp', expr: 'happy' }))
    $('sticker').src = url
    await $('sticker').decode().catch(() => {})
  },
})
</script>
</body>
</html>
