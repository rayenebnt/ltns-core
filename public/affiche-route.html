<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>LTNS° — Affiche de rue A3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

  <style>
    /* ============================================
       AFFICHE DE RUE A3 LTNS° — lisible depuis une voiture
       --------------------------------------------
       Fond violet foncé, tout le texte en blanc, éléments au plus grand :
       le titre et le numéro s'ajustent automatiquement à la largeur de l'affiche.
       QR code vers https://ltns.fr (fichier affiche-qr.png) pour les piétons.

       IMPRESSION :
       1. Ouvrir ce fichier dans Chrome
       2. Imprimer (Ctrl/Cmd+P) → A3 portrait · Marges : aucune · Échelle 100 %
          · cocher « Graphiques d'arrière-plan »
       3. Pour l'extérieur : papier 170 g+ ou plastification, colle ou
          colliers de serrage en haut et en bas
       ============================================ */

    @page { size: A3 portrait; margin: 0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root { --violet: #5b21b6; --violet-fonce: #3b0f80; --blanc: #ffffff; --noir: #0a0a0c; }

    html, body { background: #444; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body { display: grid; place-items: center; padding: 20px; min-height: 100vh; }
    @media print { html, body { background: var(--violet); padding: 0; } }

    .poster {
      width: 297mm;
      height: 420mm;
      padding: 0 8mm 9mm;
      background: radial-gradient(ellipse at 80% 10%, #7c3aed 0%, transparent 55%), linear-gradient(165deg, var(--violet) 0%, var(--violet-fonce) 100%);
      color: var(--blanc);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-family: 'Space Grotesk', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 700;
    }

    /* Bande thermique du site : froid → chaud */
    .heat { height: 6mm; margin: 0 -8mm; background: linear-gradient(90deg, #4dd0e1, #60a5fa 25%, #facc15 55%, #fb923c 80%, #ef4444); }

    .logo { display: flex; align-items: flex-start; font-size: 22mm; letter-spacing: -0.06em; line-height: 0.8; margin-top: 8mm; }
    .logo svg { width: 13mm; height: 13mm; margin: -1mm 0 0 1mm; }
    .logo svg rect { fill: var(--blanc); }
    .logo svg circle { fill: none; stroke: var(--blanc); stroke-width: 11; }

    /* Lignes ajustées à la largeur (voir le script en bas) */
    .fit { display: table; white-space: nowrap; line-height: 0.86; font-size: 60mm; }
    .deal .fit, .phone .fit { margin: 0 auto; }
    .headline { text-transform: uppercase; letter-spacing: -0.06em; }

    .deal {
      background: var(--blanc);
      color: var(--noir);
      text-transform: uppercase;
      text-align: center;
      letter-spacing: -0.02em;
      padding: 4mm 6mm 3mm;
    }
    .deal .fit { line-height: 1; }

    .phone { text-align: center; letter-spacing: -0.055em; }
    .phone .fit { line-height: 1; }

    /* QR code pour les piétons */
    .web { display: flex; align-items: center; gap: 8mm; }
    .qr-box { background: var(--blanc); padding: 8mm; flex: none; } /* marge blanche nécessaire au scan */
    .qr { display: block; width: 104mm; height: 104mm; }
    .web-txt { display: flex; flex-direction: column; gap: 3mm; flex: 1; min-width: 0; }
    .web-txt small { font-family: 'JetBrains Mono', monospace; font-size: 6.5mm; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.25; }
    .web-txt b { font-size: 30mm; letter-spacing: -0.04em; line-height: 1; }
  </style>
</head>
<body>
  <div class="poster">
    <div>
      <div class="heat"></div>
      <div class="logo">
        LTNS
        <svg viewBox="0 0 120 120" aria-hidden="true"><rect x="55" y="6" width="10" height="18" rx="1"/><circle cx="60" cy="72" r="38"/></svg>
      </div>
    </div>

    <div class="headline">
      <span class="fit" data-max="80">Sites web</span>
      <span class="fit" data-max="68">&amp; apps</span>
      <span class="fit" data-max="80">mobiles</span>
    </div>

    <div class="deal"><span class="fit" data-max="24">Devis gratuit sous 48h</span></div>

    <div class="phone"><span class="fit" data-max="70">06 25 20 64 93</span></div>

    <div class="web">
      <div class="qr-box"><img class="qr" src="affiche-qr.png" alt="QR code vers ltns.fr"></div>
      <div class="web-txt">
        <small>Scannez pour voir<br>mes réalisations</small>
        <b>ltns.fr</b>
      </div>
    </div>
  </div>

  <script>
    // Chaque ligne .fit prend toute la largeur disponible (plafonnée par data-max, en mm)
    const MM = 96 / 25.4
    function fit() {
      document.querySelectorAll('.fit').forEach(el => {
        el.style.fontSize = '100px'
        const avail = el.parentElement.clientWidth - parseFloat(getComputedStyle(el.parentElement).paddingLeft) - parseFloat(getComputedStyle(el.parentElement).paddingRight)
        const size = Math.min(100 * avail / el.scrollWidth, (+el.dataset.max || 999) * MM)
        el.style.fontSize = size + 'px'
      })
    }
    document.fonts.ready.then(fit)
    fit()
  </script>
</body>
</html>
